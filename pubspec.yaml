name: anatomy_fitness_app_mobile
description: A modern futuristic mobile fitness anatomy application.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.0
  
  # Styling & Aesthetics
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  flutter_3d_controller: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "yes"
  image_path: "app logo/reva logo.png"
  adaptive_icon_background: "#07080A"
  adaptive_icon_foreground: "app logo/reva logo.png"
  adaptive_icon_foreground_inset: 22

flutter:
  uses-material-design: true
  assets:
    - assets/images/front.png
    - assets/images/back.png
    - assets/images/side.png
    - assets/images/reva_logo.png
    - assets/models/ecorche_animated_interactive.glb
